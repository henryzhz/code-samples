[project]
name = "agent-tool-loops"
version = "0.1.0"
description = "A small Deep Agents coding agent for studying tool-call loops"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.21",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-deepseek==1.1.1",
    "langgraph-checkpoint-sqlite>=3,<4",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
